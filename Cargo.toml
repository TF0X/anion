[package]
name = "anion"
version = "0.1.0"
edition = "2024"
description = "A small, always-handy glass window for every AI chat"

[dependencies]
dirs = "7.0.0"
serde_json = "1.0.154"
tao = "0.37.2"
window-vibrancy = "0.8.1"
wry = "0.57.2"

[target.'cfg(windows)'.dependencies]
# Must match wry 0.57's own pins, or the COM interface types will not unify.
webview2-com = "0.39"
windows = "0.62"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.packager]
product-name = "Anion"
identifier = "com.priyansh.anion"
description = "A small, always-handy glass window for every AI chat"
authors = ["priyansh"]
icons = ["icons/icon.ico", "icons/icon.png"]
formats = ["nsis"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
